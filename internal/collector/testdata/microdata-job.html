<!doctype html>
<html lang="en">
<body>
  <article itemscope itemtype="https://schema.org/JobPosting">
    <h1 itemprop="title">Go Intern</h1>
    <p itemprop="description">Build backend services</p>
    <meta itemprop="validThrough" content="2026-12-01">
    <div itemprop="hiringOrganization" itemscope itemtype="https://schema.org/Organization">
      <span itemprop="name">Example Engineering</span>
    </div>
    <div itemprop="occupationalCategory">Backend</div>
    <span itemprop="skills">Go</span>
    <span itemprop="skills">Python</span>
    <span itemprop="employmentType">INTERN</span>
    <span itemprop="workHours">20 hours per week</span>
    <div itemprop="jobLocation" itemscope itemtype="https://schema.org/Place">
      <div itemprop="address" itemscope itemtype="https://schema.org/PostalAddress">
        <span itemprop="addressLocality">Kazan</span>
        <span itemprop="addressCountry">Russia</span>
      </div>
    </div>
    <div itemprop="baseSalary" itemscope itemtype="https://schema.org/MonetaryAmount">
      <meta itemprop="currency" content="RUB">
      <div itemprop="value" itemscope itemtype="https://schema.org/QuantitativeValue">
        <meta itemprop="minValue" content="80000">
        <meta itemprop="maxValue" content="120000">
        <meta itemprop="unitText" content="MONTH">
      </div>
    </div>
    <a href="https://example.org/apply/123">Apply</a>
  </article>
</body>
</html>
